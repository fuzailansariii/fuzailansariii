<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Mohd Fuzail Ansari — Full-Stack Developer. Next.js, TypeScript, PostgreSQL. Open to full-time roles.">
  <style>
    .crt { animation: flicker 4s infinite steps(1); }
    @keyframes flicker { 0%,100% {opacity:1} 42% {opacity:.93} 43% {opacity:1} 77% {opacity:.96} 78% {opacity:1} }
    .led { animation: led 1.6s infinite; }
    @keyframes led { 50% { opacity:.25 } }
    .roll { animation: roll 6s linear infinite; }
    @keyframes roll { from { transform: translateY(0) } to { transform: translateY(390px) } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
        .c0 { animation: k0 1.44s steps(41) 0.40s forwards; }
    @keyframes k0 { to { transform: translateX(418px) } }
    .c1 { animation: k1 0.28s steps(8) 2.14s forwards; }
    @keyframes k1 { to { transform: translateX(101px) } }
    .c2 { animation: k2 0.63s steps(18) 2.72s forwards; }
    @keyframes k2 { to { transform: translateX(348px) } }
    .c3 { animation: k3 1.05s steps(30) 3.65s forwards; }
    @keyframes k3 { to { transform: translateX(312px) } }
    .c4 { animation: k4 0.53s steps(15) 5.00s forwards; }
    @keyframes k4 { to { transform: translateX(168px) } }
    .c5 { animation: k5 1.58s steps(45) 5.82s forwards; }
    @keyframes k5 { to { transform: translateX(456px) } }
    .c6 { animation: k6 1.26s steps(36) 7.70s forwards; }
    @keyframes k6 { to { transform: translateX(370px) } }
    .cur { opacity:0; animation: show 0s 8.96s forwards, blink 1s steps(1) 8.96s infinite; }
    @keyframes show { to { opacity:1 } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.28)"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="24" y="44" width="792" height="262" rx="14"/></clipPath>
  </defs>
  <rect width="840" height="330" rx="20" fill="#1b1b1b"/>
  <rect x="6" y="6" width="828" height="318" rx="16" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <circle cx="34" cy="25" r="5" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="25" r="5" fill="#27c93f"/>
  <text x="420.0" y="30" text-anchor="middle" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#8a8a8a">fuzail@dev: ~ — tty1</text>
  <circle cx="806" cy="25" r="4" fill="#33ff66" class="led"/>
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="840" height="330" fill="#0b0f0a"/>
    <g class="crt">
      <g filter="url(#glow)">
                <text x="52" y="84" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#1f9e45" xml:space="preserve">$ boot fuzail.dev ................ [ OK ]</text>
        <text x="52" y="116" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#33ff66" xml:space="preserve">$ whoami</text>
        <text x="52" y="156" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="30" font-weight="bold" fill="#ffb000" xml:space="preserve">MOHD FUZAIL ANSARI</text>
        <text x="52" y="188" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#33ff66" xml:space="preserve">  Full-Stack Developer · India</text>
        <text x="52" y="222" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#33ff66" xml:space="preserve">$ cat stack.txt</text>
        <text x="52" y="250" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#33ff66" xml:space="preserve">  Next.js · TypeScript · PostgreSQL · Drizzle</text>
        <text x="52" y="284" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="16" font-weight="normal" fill="#ffb000" xml:space="preserve">$ status --&gt; open to full-time roles</text>
        <rect class="cur" x="404" y="269" width="10" height="18" fill="#ffb000"/>
      </g>
            <rect class="c0" x="48" y="66" width="417.59999999999997" height="24.0" fill="#0b0f0a"/>
      <rect class="c1" x="48" y="98" width="100.8" height="24.0" fill="#0b0f0a"/>
      <rect class="c2" x="48" y="124" width="348.0" height="45.0" fill="#0b0f0a"/>
      <rect class="c3" x="48" y="170" width="312.0" height="24.0" fill="#0b0f0a"/>
      <rect class="c4" x="48" y="204" width="168.0" height="24.0" fill="#0b0f0a"/>
      <rect class="c5" x="48" y="232" width="456.0" height="24.0" fill="#0b0f0a"/>
      <rect class="c6" x="48" y="266" width="369.59999999999997" height="24.0" fill="#0b0f0a"/>
    </g>
    <rect x="0" y="0" width="840" height="330" fill="url(#scan)"/>
    <rect x="0" y="0" width="840" height="330" fill="url(#vig)"/>
    <rect x="0" y="-60" width="840" height="60" fill="#33ff66" opacity="0.05" class="roll"/>
  </g>
</svg>
