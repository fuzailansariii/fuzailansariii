<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-label="Thanks for stopping by. Press start to connect.">
  <style>
    .crt { animation: flicker 4s infinite steps(1); }
    @keyframes flicker { 0%,100% {opacity:1} 42% {opacity:.93} 43% {opacity:1} 77% {opacity:.96} 78% {opacity:1} }
    .led { animation: led 1.6s infinite; }
    @keyframes led { 50% { opacity:.25 } }
    .roll { animation: roll 6s linear infinite; }
    @keyframes roll { from { transform: translateY(0) } to { transform: translateY(230px) } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }</style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.28)"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="24" y="44" width="792" height="102" rx="14"/></clipPath>
  </defs>
  <rect width="840" height="170" rx="20" fill="#1b1b1b"/>
  <rect x="6" y="6" width="828" height="158" rx="16" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <circle cx="34" cy="25" r="5" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="25" r="5" fill="#27c93f"/>
  <text x="420.0" y="30" text-anchor="middle" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#8a8a8a">fuzail@dev: ~ — exit</text>
  <circle cx="806" cy="25" r="4" fill="#33ff66" class="led"/>
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="840" height="170" fill="#0b0f0a"/>
    <g class="crt" filter="url(#glow)" font-family="'Courier New', Courier, 'Liberation Mono', monospace" text-anchor="middle">
      <text x="420.0" y="84" font-size="15" fill="#1f9e45">HI-SCORE  ·  2 LIVE CLIENT PRODUCTS  ·  REAL PAYMENTS</text>
      <text x="420.0" y="120" font-size="24" font-weight="bold" fill="#ffb000" class="blink">▶ PRESS START TO CONNECT ◀</text>
    </g>
    <rect x="0" y="0" width="840" height="170" fill="url(#scan)"/>
    <rect x="0" y="0" width="840" height="170" fill="url(#vig)"/>
    <rect x="0" y="-60" width="840" height="60" fill="#33ff66" opacity="0.05" class="roll"/>
  </g>
</svg>
